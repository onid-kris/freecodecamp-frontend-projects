<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survey Form</title>
</head>
<body>
    <h1 id="title">Survey Form</h1>
    <p id="description">Please fill out this survey to help us improve our services.
</p>
<form id="survey-form">
    <label for="name" id="name-label">Name:</label>
    <input 
    required
    placeholder="e.g., Johnny Bravo"
    id="name"
    name="name"
    type="text">
    <label for="email" id="email-label">Email:</label>
    <input 
    required
    placeholder="example@email.com"
    id="email"
    name="email"
    type="email">
    <label for="number" id="number-label">Age:</label>
    <input 
    placeholder="e.g.,18"
    max="3"
    min="100"
    id="number"
    name="number"
    type="number">

    <select name="#" id="dropdown">
    <option value="choice1">choice1</option>
    <option value="choice2">choice2</option>
</select>
    <fieldset>
        <legend>
            How satisfied are you with our service?
        </legend>
        <label>
            Very Satisfied
        <input type="radio" name="satisfaction"
        value="satisfied">
</label>
        <label>
            Neutral
        <input type="radio" name="satisfaction"
        value="neutral">
</label>
        <label>
            Not Satisfied
        <input type="radio" name="satisfaction"
        value="not-satisfied">
</label>
</fieldset>
<fieldset>
    Whats the Best thing that we offer that make you comeback to us?

<label>Food
    <input type="checkbox"  name="food" value="food">
</label>
<label>Service
    <input type="checkbox"  name="service" value="service">
</label>
<label>Ambiance
    <input type="checkbox"  name="ambiance" value="ambiance">
</label>
<label>Price
    <input type="checkbox"  name="price" value="price">
</label>
<label>Other
    <input type="checkbox"  name="other" value="other">
</label>
</fieldset>
 
<label for="comments">Additional Comments</label>
<textarea name="comments" id="comments" rows="8"></textarea>
<button type="submit" id="submit">
    Submit
</button>
</form>
</body>
</html>
